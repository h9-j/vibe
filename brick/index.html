<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263036">
  <title>BRICK SHIFT — 벽돌 깨기</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">◈</span> BRICK <strong>SHIFT</strong></div><span class="top-note">ELEMENTAL ARCADE · 2026</span></header>
    <div class="game-wrap" id="gameWrap">
      <canvas id="game" width="960" height="720" aria-label="BRICK SHIFT 게임 화면"></canvas>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </div>
    <div class="mobile-controls" aria-label="터치 조작">
      <button id="leftBtn" aria-label="왼쪽 이동">◀</button>
      <button id="rightBtn" aria-label="오른쪽 이동">▶</button>
      <button id="launchBtn">발사</button>
      <button id="shiftBtn">속성 전환</button>
      <button id="ultBtn">필살기</button>
      <button id="pauseBtn">일시정지</button>
    </div>
    <footer class="help"><span>이동 <b>마우스 / A D / ← →</b></span><span>발사·리시브 <b>클릭 / SPACE</b></span><span>속성 <b>1 2 3 / Q E</b></span><span>필살기 <b>X / 우클릭</b></span><span>일시정지 <b>ESC / P</b></span></footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
